services:
  app:
    build:
      context: .
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SERVER_PORT: "${SERVER_PORT:-8080}"
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "${SERVER_SERVLET_SESSION_COOKIE_SECURE:-false}"
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/news_material}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME:-news_material}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:-demo-only-postgres}"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-demo-minio-user}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-demo-only-minio-password}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      NEWS_MATERIAL_S3_BUCKET: "${NEWS_MATERIAL_S3_BUCKET:-news-material-private}"
      NEWS_MATERIAL_S3_ENDPOINT: "${NEWS_MATERIAL_S3_ENDPOINT:-http://minio:9000}"
      NEWS_MATERIAL_S3_PRESIGNER_ENDPOINT: "${NEWS_MATERIAL_S3_PRESIGNER_ENDPOINT:-http://localhost:9000}"
      NEWS_MATERIAL_S3_PATH_STYLE: "${NEWS_MATERIAL_S3_PATH_STYLE:-true}"
      NEWS_MATERIAL_AI_PROVIDER: "${NEWS_MATERIAL_AI_PROVIDER:-local}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_VISION_MODEL: "${OPENAI_VISION_MODEL:-gpt-5-mini}"
      OPENAI_CONNECT_TIMEOUT: "${OPENAI_CONNECT_TIMEOUT:-PT3S}"
      OPENAI_REQUEST_TIMEOUT: "${OPENAI_REQUEST_TIMEOUT:-PT20S}"
      ANALYSIS_LEASE_DURATION: "${ANALYSIS_LEASE_DURATION:-PT5M}"
      APP_ANALYSIS_SCHEDULING_ENABLED: "${APP_ANALYSIS_SCHEDULING_ENABLED:-true}"
      APP_ANALYSIS_MAX_ATTEMPTS: "${APP_ANALYSIS_MAX_ATTEMPTS:-3}"
      APP_ANALYSIS_BASE_BACKOFF: "${APP_ANALYSIS_BASE_BACKOFF:-PT1M}"
      APP_ANALYSIS_POLL_DELAY_MS: "${APP_ANALYSIS_POLL_DELAY_MS:-5000}"
      APP_UPLOAD_MAX_FILES: "${APP_UPLOAD_MAX_FILES:-10}"
      APP_UPLOAD_MAX_FILE_BYTES: "${APP_UPLOAD_MAX_FILE_BYTES:-52428800}"
      APP_UPLOAD_MAX_TOTAL_BYTES: "${APP_UPLOAD_MAX_TOTAL_BYTES:-209715200}"
      APP_UPLOAD_INTENT_TTL: "${APP_UPLOAD_INTENT_TTL:-PT15M}"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:${SERVER_PORT:-8080}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: news_material
      POSTGRES_USER: news_material
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-demo-only-postgres}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_material -d news_material"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-demo-minio-user}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-demo-only-minio-password}"
      MINIO_API_CORS_ALLOW_ORIGIN: "${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:8080}"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-demo-minio-user}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-demo-only-minio-password}"
      NEWS_MATERIAL_S3_BUCKET: "${NEWS_MATERIAL_S3_BUCKET:-news-material-private}"
    entrypoint: >-
      /bin/sh -c '
      mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
      mc mb --ignore-existing "local/$${NEWS_MATERIAL_S3_BUCKET}" &&
      mc anonymous set none "local/$${NEWS_MATERIAL_S3_BUCKET}"
      '
    restart: "no"

volumes:
  postgres-data:
  minio-data:
