spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/news_material
    username: news_material
    password: news_material
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  storage:
    bucket: ${NEWS_MATERIAL_S3_BUCKET:news-material-private}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${NEWS_MATERIAL_S3_ENDPOINT:}
    presigner-endpoint: ${NEWS_MATERIAL_S3_PRESIGNER_ENDPOINT:}
    path-style: ${NEWS_MATERIAL_S3_PATH_STYLE:false}
  upload:
    max-files: 10
    max-file-bytes: 52428800
    max-total-bytes: 209715200
    intent-ttl: PT15M
  analysis:
    provider: ${NEWS_MATERIAL_AI_PROVIDER:openai}
    scheduling-enabled: true
    max-attempts: 3
    base-backoff: PT1M
    lease-duration: ${ANALYSIS_LEASE_DURATION:PT5M}
    poll-delay-ms: 5000
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_VISION_MODEL:gpt-5-mini}
      connect-timeout: ${OPENAI_CONNECT_TIMEOUT:PT3S}
      request-timeout: ${OPENAI_REQUEST_TIMEOUT:PT20S}
