spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/news_material
    username: news_material
    password: news_material
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
app:
  storage:
    bucket: ${NEWS_MATERIAL_S3_BUCKET:news-material-private}
    region: ${AWS_REGION:us-east-1}
  upload:
    max-files: 10
    max-file-bytes: 52428800
    max-total-bytes: 209715200
    intent-ttl: PT15M
