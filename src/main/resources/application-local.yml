server:
  servlet:
    session:
      cookie:
        secure: false

spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:news_material;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
app:
  storage:
    local-root: ${java.io.tmpdir}/news-material-storage
  upload:
    intent-ttl: PT15M
  analysis:
    provider: local
    scheduling-enabled: false
